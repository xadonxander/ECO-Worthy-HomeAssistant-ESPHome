  - type: entities
    title: Load output
    show_header_toggle: false
    entities:
    - entity: switch.garage_modbus_bridge_mppt_load_output
      name: Load
      icon: mdi:lightbulb
    - entity: select.garage_modbus_bridge_mppt_load_mode
      name: Load mode
    - entity: sensor.garage_modbus_bridge_mppt_load_voltage
    - entity: sensor.garage_modbus_bridge_mppt_load_current
    - entity: sensor.garage_modbus_bridge_mppt_load_power
  - type: vertical-stack
    cards:
    - type: entities
      title: Temperature
      show_header_toggle: false
      entities:
      - entity: select.garage_modbus_bridge_mppt_draft_temperature_unit
        name: Controller temperature unit
    - type: markdown
      content: "{% set unit = '°F' if is_state('select.garage_modbus_bridge_mppt_draft_temperature_unit', 'Fahrenheit')\
        \ else '°C' %}\n{% for entity, label in [\n  ('sensor.garage_modbus_bridge_mppt_external_temperature', 'External\
        \ temperature'),\n  ('sensor.garage_modbus_bridge_mppt_internal_temperature_probable', 'Internal temperature\
        \ (probable)')\n] %}\n**{{ label }}:** {% set value = states(entity) %}{% if is_number(value) %}{{ value\
        \ | float | round(1) }} {{ unit }}{% else %}{{ value }}{% endif %}  \n{% endfor %}"
  - type: entities
    title: Controller faults
    show_header_toggle: false
    entities:
    - entity: binary_sensor.garage_modbus_bridge_mppt_battery_overvoltage_fault
    - entity: binary_sensor.garage_modbus_bridge_mppt_battery_low_voltage_fault
