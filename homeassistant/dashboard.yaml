title: ECO-WORTHY MPPT
views:
- title: Readings
  path: readings
  icon: mdi:solar-power
  cards:
  - type: entities
    title: Solar and charging
    show_header_toggle: false
    entities:
    - entity: sensor.garage_modbus_bridge_mppt_pv_voltage
    - entity: sensor.garage_modbus_bridge_mppt_battery_voltage
    - entity: sensor.garage_modbus_bridge_mppt_charging_current
    - entity: sensor.garage_modbus_bridge_mppt_charging_power
