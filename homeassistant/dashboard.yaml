- title: History
  path: history
  icon: mdi:calendar-month
  cards:
  - type: custom:tabbed-card
    options:
      defaultTabIndex: 0
    tabs:
    - attributes:
        label: Month
        icon: mdi:calendar-month
      card:
        type: custom:apexcharts-card
        header:
          show: true
          title: Daily production (kWh)
          show_states: false
        graph_span: 32d
        apex_config:
          chart:
            height: 500
            toolbar:
              show: false
          stroke:
            curve: straight
            width: 2
          markers:
            size: 5
            hover:
              size: 8
          tooltip:
            enabled: true
            shared: false
            intersect: true
            x:
              formatter: EVAL:function(value) { const n=new Date(); const a=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12).getTime();
                const b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-30,12).getTime(); return new Date(a+b-Number(value)).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
                }
            'true':
              formatter: EVAL:function(value) { return value.toFixed(1) + " kWh"; }
          xaxis:
            type: datetime
            labels:
              formatter: EVAL:function(value) { const n=new Date(); const a=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12).getTime();
                const b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-30,12).getTime(); return String(new Date(a+b-Number(value)).getDate());
                }
          yaxis:
            min: 0
            decimalsInFloat: 1
        series:
        - entity: sensor.garage_modbus_bridge_mppt_history_daily_slot_01
          name: Daily energy
          type: line
          data_generator: "const prefix = 'sensor.garage_modbus_bridge_mppt_history_daily_slot_';\nconst now = new\
            \ Date();\nconst year = now.getFullYear();\nconst month = now.getMonth();\nconst count = 31;\nconst\
            \ points = [];\nfor (let i = 1; i <= count; i++) {\n  const id = prefix + String(i).padStart(2, '0');\n\
            \  const raw = hass.states[id]?.state;\n  if (raw === undefined || raw === 'unknown' || raw === 'unavailable'\
            \ || raw === '') continue;\n  const value = Number(raw);\n  if (!Number.isFinite(value)) continue;\n\
            \  const date = new Date(year, month, now.getDate() - (count - i), 12);\n  points.push([date.getTime(),\
            \ value]);\n}\nreturn points;"
    - attributes:
        label: Year
        icon: mdi:calendar
      card:
        type: custom:apexcharts-card
        header:
          show: true
          title: Monthly production (kWh)
          show_states: false
        graph_span: 1y
        apex_config:
          chart:
            height: 500
            toolbar:
              show: false
          stroke:
            curve: straight
            width: 2
          markers:
            size: 5
            hover:
              size: 8
          tooltip:
            enabled: true
            shared: false
            intersect: true
            x:
              formatter: EVAL:function(value) { const n=new Date(); const v=new Date(Number(value)); const offset=(n.getFullYear()-v.getFullYear())*12+n.getMonth()-v.getMonth();
                return new Date(n.getFullYear(),n.getMonth()-(11-offset),1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
                }
            'true':
              formatter: EVAL:function(value) { return value.toFixed(1) + " kWh"; }
          xaxis:
            type: datetime
            labels:
              formatter: EVAL:function(value) { const n=new Date(); const v=new Date(Number(value)); const offset=(n.getFullYear()-v.getFullYear())*12+n.getMonth()-v.getMonth();
                return new Date(n.getFullYear(),n.getMonth()-(11-offset),1).toLocaleDateString(undefined,{month:'short'});
                }
          yaxis:
            min: 0
            decimalsInFloat: 1
        series:
        - entity: sensor.garage_modbus_bridge_mppt_history_monthly_slot_01
          name: Monthly energy
          type: line
          data_generator: "const prefix = 'sensor.garage_modbus_bridge_mppt_history_monthly_slot_';\nconst now =\
            \ new Date();\nconst year = now.getFullYear();\nconst month = now.getMonth();\nconst count = 12;\nconst\
            \ points = [];\nfor (let i = 1; i <= count; i++) {\n  const id = prefix + String(i).padStart(2, '0');\n\
            \  const raw = hass.states[id]?.state;\n  if (raw === undefined || raw === 'unknown' || raw === 'unavailable'\
            \ || raw === '') continue;\n  const value = Number(raw);\n  if (!Number.isFinite(value)) continue;\n\
            \  const date = new Date(year, month - (count - i), 1, 12);\n  points.push([date.getTime(), value]);\n\
            }\nreturn points;"
  panel: true
