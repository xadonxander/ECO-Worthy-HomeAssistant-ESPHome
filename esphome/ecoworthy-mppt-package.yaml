# ECO-WORTHY MPPT standalone ESPHome package. NO JK BMS/Bluetooth dependencies.
# Include using ESPHome packages from a device-specific YAML, do not flash alone.
# ACTIVE RS485 MASTER: disconnect the OEM BT-02 before polling or writing.
substitutions:
  rs485_rx_pin: GPIO16
  rs485_tx_pin: GPIO17
  rs485_direction_pin: GPIO18

