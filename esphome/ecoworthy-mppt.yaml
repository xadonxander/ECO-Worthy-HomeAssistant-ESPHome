# ECO-WORTHY ESPHome controller: read monitoring + captured FC10 battery configuration write.
# Preserves JK BMS, MPPT entities and secrets; writes are disabled at boot.
# ECO-WORTHY MODBUS MASTER + JK BMS
# DISCONNECT BT-02 BEFORE FLASHING: this firmware transmits Modbus requests.
# Battery FC10 write based on captured OEM request; hardware write testing still required.
# Historical date alignment remains provisional.
substitutions:
  bms1_name: "Battery 1"
  bms2_name: "Battery 2"

  bms1_mac: "AA:BB:CC:DD:EE:01"
  bms2_mac: "AA:BB:CC:DD:EE:02"

  protocol_version: JK02_32S

  rs485_rx_pin: GPIO16
  rs485_tx_pin: GPIO17
  rs485_direction_pin: GPIO18

esphome:
  name: modbus_bridge
  friendly_name: "Modbus Bridge"

preferences:
  flash_write_interval: 60s

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# ============================================================
# EXTERNAL JK-BMS COMPONENT
# ============================================================

external_components:
  - source:
      type: git
      url: https://github.com/syssi/esphome-jk-bms
    components: [jk_bms_ble]

# ============================================================
# API - MUST MATCH EXISTING SNIFFER FIRMWARE KEY
# ============================================================

api:
  encryption:
    key: !secret JKBMS_API_KEY

# ============================================================
# OTA - MUST MATCH PASSWORD CURRENTLY ON DEVICE
# ============================================================

ota:
  - platform: esphome
    password: !secret JKBMS_OTA_PASSWORD

# ============================================================
# LOGGER
# ============================================================

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    jk_bms_ble: INFO

# ============================================================
# WIFI
# ============================================================

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password2
  # Optional: set use_address to your device's IP or hostname if needed
  ap:
    ssid: "JKBMS Relay Fallback"
    password: !secret fallbackAP_Password

captive_portal:

# ============================================================
# BLUETOOTH
# ============================================================

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:

  # ----------------------------------------------------------
  # BATTERY 1
  # ----------------------------------------------------------

  - mac_address: ${bms1_mac}
    id: battery1_ble
    auto_connect: true

  # ----------------------------------------------------------
  # BATTERY 2
  # ----------------------------------------------------------

  - mac_address: ${bms2_mac}
    id: battery2_ble
    auto_connect: true

# ============================================================
# JK BMS INSTANCES
# ============================================================

jk_bms_ble:

  # ----------------------------------------------------------
  # BATTERY 1
  # ----------------------------------------------------------

  - ble_client_id: battery1_ble
    protocol_version: ${protocol_version}
    throttle: 5s
    id: battery1_bms

  # ----------------------------------------------------------
  # BATTERY 2
  # ----------------------------------------------------------

  - ble_client_id: battery2_ble
    protocol_version: ${protocol_version}
    throttle: 5s
    id: battery2_bms

# ============================================================
# BINARY SENSORS
# ============================================================

binary_sensor:

  # Decoded from 0x150C; these are read-only
  - platform: template
    id: mppt_overvoltage_fault
    name: "MPPT Battery Overvoltage Fault"
    device_class: problem
  - platform: template
    id: mppt_low_voltage_fault
    name: "MPPT Battery Low Voltage Fault"
    device_class: problem

  # ==========================================================
  # BATTERY 1
  # ==========================================================

  - platform: jk_bms_ble
    jk_bms_ble_id: battery1_bms

    balancing:
      name: "${bms1_name} Balancing"

    charging:
      name: "${bms1_name} Charging"

    discharging:
      name: "${bms1_name} Discharging"

    online_status:
      name: "${bms1_name} Online"

  # ==========================================================
  # BATTERY 2
  # ==========================================================

  - platform: jk_bms_ble
    jk_bms_ble_id: battery2_bms

    balancing:
      name: "${bms2_name} Balancing"

    charging:
      name: "${bms2_name} Charging"

    discharging:
      name: "${bms2_name} Discharging"

    online_status:
      name: "${bms2_name} Online"

